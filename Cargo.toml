[package]
name = "koritsu"
version = "0.6.0"
edition = "2024"
license = "GPL-2.0-only"
description = "効率 — track wasted vs productive time, Pomodoro and todos in a tiny widget"
authors = ["watsonjph"]
homepage = "https://github.com/watsonjph/Koritsu"
repository = "https://github.com/watsonjph/Koritsu"

[dependencies]
dioxus = { version = "0.7.9", features = ["desktop"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
notify-rust = "4"
base64 = "0.22"
tokio = { version = "1", features = ["time"] }
# Decodes the bundled icon; Dioxus already builds this crate.
image = { version = "0.25", default-features = false, features = ["png"] }

# Monitor work area for corner snapping, and the Run key for autostart; tao already builds this crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_System_Registry"] }

# Puts the fox icon on the .exe itself (Explorer, shortcuts).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = true

# Linux packages, built in CI (.github/workflows/release.yml).
# Runtime libraries: the WebView (WebKitGTK), GTK, the tray (AppIndicator) and global shortcuts (xdo).
[package.metadata.deb]
maintainer = "watsonjph"
section = "utils"
priority = "optional"
depends = "libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1, libxdo3"
extended-description = "A tiny always-on-top widget that counts the time you waste and the time you spend well, with a Pomodoro, todos and a pixel-art companion."
assets = [
  ["target/release/koritsu", "usr/bin/", "755"],
  ["assets/linux/koritsu.desktop", "usr/share/applications/", "644"],
  ["docs/logo.png", "usr/share/icons/hicolor/256x256/apps/koritsu.png", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/koritsu", dest = "/usr/bin/koritsu", mode = "755" },
  { source = "assets/linux/koritsu.desktop", dest = "/usr/share/applications/koritsu.desktop", mode = "644" },
  { source = "docs/logo.png", dest = "/usr/share/icons/hicolor/256x256/apps/koritsu.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
"webkit2gtk4.1" = "*" # quoted: a bare dotted key would be read as a nested table
gtk3 = "*"
libayatana-appindicator-gtk3 = "*"
libxdo = "*"
