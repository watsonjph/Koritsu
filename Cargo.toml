[package]
name = "koritsu"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
description = "効率 — track wasted vs productive time, Pomodoro and todos in a tiny widget"

[dependencies]
dioxus = { version = "0.7.9", features = ["desktop"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
notify-rust = "4"
base64 = "0.22"
tokio = { version = "1", features = ["time"] }

[profile.release]
lto = true
strip = true
