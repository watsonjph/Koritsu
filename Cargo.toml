[package]
name = "koritsu"
version = "0.3.0"
edition = "2024"
license = "GPL-2.0-only"
description = "効率 — track wasted vs productive time, Pomodoro and todos in a tiny widget"

[dependencies]
dioxus = { version = "0.7.9", features = ["desktop"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
notify-rust = "4"
base64 = "0.22"
tokio = { version = "1", features = ["time"] }
# Decodes the bundled icon; Dioxus already builds this crate.
image = { version = "0.25", default-features = false, features = ["png"] }

# Monitor work area for corner snapping, and the Run key for autostart; tao already builds this crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_System_Registry"] }

# Puts the fox icon on the .exe itself (Explorer, shortcuts).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = true
